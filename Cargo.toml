[package]
name = "matrix-journal"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "=4.5", features = ["derive"] }
env_logger = "0.11"
iana-time-zone = "0.1"
log = "0.4"
matrix-sdk = "0.16"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
xdg = "3.0"
